name: Build Android APK from Web App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web App
        run: npm run build

      - name: Install & Configure Capacitor
        run: |
          npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Al-Quran" "com.alquran.app" --web-dir dist
          npx cap add android
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Al-Quran-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
